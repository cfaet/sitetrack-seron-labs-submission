services:
  db:
    image: postgres:16.16-bookworm
    environment:
      # Public demo credentials for this isolated reviewer environment only.
      POSTGRES_DB: sitetrack
      POSTGRES_USER: sitetrack
      POSTGRES_PASSWORD: sitetrack_demo_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sitetrack", "-d", "sitetrack"]
      # Fresh initdb may take time; its temporary server listens only on a socket.
      start_period: 90s
      interval: 3s
      timeout: 3s
      retries: 10
    # PostgreSQL is reachable only on the Compose network.
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://sitetrack:sitetrack_demo_only@db:5432/sitetrack
      # Public local-only signing key, independent of native private credentials.
      AUTH_JWT_SECRET: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
      AUTH_COOKIE_SECURE: "false"
      AUTH_ALLOWED_ORIGINS: "http://localhost:${SITETRACK_HTTP_PORT:-3000},http://127.0.0.1:${SITETRACK_HTTP_PORT:-3000}"
      HOST: 0.0.0.0
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SITETRACK_HTTP_PORT:-3000}:3000"
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 6
volumes:
  postgres_data:
